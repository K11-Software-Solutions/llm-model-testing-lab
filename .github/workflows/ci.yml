name: CI quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TRANSFORMERS_VERBOSITY: error
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_DISABLE_UPDATE: "1"
  MODEL_ID: HuggingFaceTB/SmolLM2-135M-Instruct

jobs:
  tinygpt-and-unit:
    name: TinyGPT + evaluator unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU-only PyTorch, then the rest
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Unit, training and memorisation tests (no model download)
        run: pytest --junitxml=reports/junit-unit.xml
      - name: Train TinyGPT and keep the loss curve
        run: python -m tinygpt.train --steps 800 --out artifacts/tinygpt.pt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinygpt-and-unit
          path: |
            reports/
            artifacts/tinygpt.history.json

  model-evals:
    name: Real model evals (SmolLM2-135M)
    runs-on: ubuntu-latest
    needs: tinygpt-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.MODEL_ID }}-v1
      - name: Integration tests against the real model
        run: pytest -m hf
      - name: Model evals with regression gates (release bar reported, not blocking)
        run: python -m evals.run_model_evals
      - name: Publish report to the job summary
        if: always()
        run: cat evals/results/model_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Gate sanity check (random weights MUST fail the gate)
        run: |
          if python -m evals.run_model_evals --variant random --fast --out /tmp/negative-control > /dev/null; then
            echo "::error::The quality gate passed a randomly initialised model. The gate is broken."
            exit 1
          fi
          echo "Gate correctly rejected the random-weights model."
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-report
          path: evals/results/

  promptfoo:
    name: Promptfoo suites
    runs-on: ubuntu-latest
    needs: tinygpt-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.MODEL_ID }}-v1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Behaviour regression suite (blocking)
        env:
          PROMPTFOO_PYTHON: python
        run: npx -y promptfoo@0.124.0 eval -c evals/promptfoo/promptfooconfig.yaml --no-cache --no-progress-bar -j 1 -o promptfoo-regression.json
      - name: Red-team probes (informational; failures expected for a 135M model)
        env:
          PROMPTFOO_PYTHON: python
        run: |
          if npx -y promptfoo@0.124.0 eval -c evals/promptfoo/promptfooconfig.redteam.yaml --no-cache --no-progress-bar -j 1 -o promptfoo-redteam.json; then
            echo "Red-team probes: all passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Red-team probes failed as expected: this model is not safety-tuned. See promptfoo-redteam.json."
            echo "Red-team probes: failures found (expected for SmolLM2-135M; informational)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: promptfoo-*.json
          if-no-files-found: ignore
